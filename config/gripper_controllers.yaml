controller_manager:
  ros__parameters:
    update_rate: 100

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 0.05

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
    # Dieu khien bang LUC (effort): luc ep len cube = p * sai_so_vi_tri, nen co gioi han va on dinh.
    # (Dieu khien bang vi tri cua gazebo_ros2_control dat khop truc tiep, khong kep chat duoc cube.)
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      left_finger_joint:
        p: 3000.0
        i: 0.0
        d: 40.0
      right_finger_joint:
        p: 3000.0
        i: 0.0
        d: 40.0
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.5
      left_finger_joint:
        trajectory: 0.0
        goal: 0.02
      right_finger_joint:
        trajectory: 0.0
        goal: 0.02
